<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportune - A Placement Portal</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/login.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Tektur:wght@400..900&family=Vast+Shadow&display=swap" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alerts">
                {% for category, message in messages %}
                <div class="alert {{ category }}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    <main >
        <form action="{{ url_for('login') }}" method="post" class="plate">
            <h1>Opportune</h1>
            <p>Your Placement Support</p>
             
            <input type="hidden" name="role" id="role">

            <div class="opt">
                <button type="button" class="role-btn" onclick="setRole(this,'student')" style="background: linear-gradient(0deg,rgba(144, 238, 144, 0.100),#d8a0ed10); color: green;">Students</button>
                <button type="button" class="role-btn" onclick="setRole(this,'company')" style="background: linear-gradient(0deg,rgba(135, 207, 235, 0.100),#d8a0ed10); color: blue;">Companies</button>
                <button type="button" class="role-btn" onclick="setRole(this,'admin')" style="background: linear-gradient(0deg,rgba(248, 248, 57, 0.100),#d8a0ed10); color: rgb(196, 196, 3);">Admin</button>
            </div>
            <div class="d">
                <h3>Email</h3>
                <input type="email" name="email" value="{{ email if email else '' }}" placeholder="example@gmail.com">
            </div>

            <div class="d">
                <h3>Password</h3>
                <input type="password" name="password" >
            </div>

            <div>
                <button type="submit" id="loginBtn">Login</button>
            </div>
        </form>
        <p>Don't have an Account? <a href="{{ url_for('register') }}">Create an Account</a></p>

    </main>
</body>
                       <!-- script -->
<script>
    function setRole(btn, role){
         
        document.getElementById("role").value = role;
        document.querySelectorAll(".role-btn").forEach(function(b){
            b.classList.remove("active");
        });
        btn.classList.add("active");
    }
    
    setTimeout(() => {
        document.querySelectorAll(".alert").forEach(el => {
            el.style.display = "none";
        });
    }, 3000);

</script>
</html>
