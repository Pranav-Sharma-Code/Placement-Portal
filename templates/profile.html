<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportune - A Placement Portal</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/profile.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Tektur:wght@400..900&family=Vast+Shadow&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <header class="header">
            <div class="back">
                <button  onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
            </div>
            <h1>Profile</h1>
            <div class="back">
                <button onclick="window.location.href='/logout'"><span class="material-symbols-outlined">logout</span></button>
            </div>
    </header>
    <main class="plate">
        <form id="pform" action="{{ url_for('profile') }}" method="post" enctype="multipart/form-data">

            <div class="ele">
                <h3>Full Name</h3>
                <input type="text" name="name" value="{{ user.name }}" readonly>
            </div>
            <div class="ele">
                <h3>Email</h3>
                <input type="email" name="email" value="{{ user.email }}" readonly>
            </div>
            <div class="ele">
                <h3>Number</h3>
                <input type="text" name="number" value="{{ user.number }}" readonly>
            </div>

            <div class="ele">
                <h3>CGPA</h3>
                <input type="number" step="0.01" name="cgpa" value="{{ user.cgpa }}" readonly>
            </div>

            <div class="ele">
                <h3>Course</h3>
                <select name="course" id="course" disabled>
                    <option value="" disabled>--Select--</option>
                    <option value="BTech" {% if user.course == 'BTech' %} selected {% endif %}>Bachelor of Technology (BTech)</option>
                    <option value="BS" {% if user.course == 'BS' %} selected {% endif %}>Bachelor of Science (BS)</option>
                    <option value="MTech" {% if user.course == 'MTech' %} selected {% endif %}>Master of Technology (MTech)</option>
                    <option value="MCA" {% if user.course == 'MCA' %} selected {% endif %}>Master of Computer Applications (MCA)</option>
                    <option value="BCA" {% if user.course == 'BCA' %} selected {% endif %}>Bachelor of Computer Applications (BCA)</option>
                </select>
            </div>
            <div class="ele">
                <h3>Branch</h3>
                <select name="branch" id="branch" disabled >
                    <option value="" disabled>--Select--</option>
                    <option value="CS" {% if user.branch == 'CS' %} selected {% endif %}>Computer Science (CS)</option>
                    <option value="DS" {% if user.branch == 'DS' %} selected {% endif %}>Data Science (DS)</option>
                    <option value="ECE" {% if user.branch == 'ECE' %} selected {% endif %}>Electronics and Communication Engineering (ECE)</option>
                    <option value="AI & ML" {% if user.branch == 'AI & ML' %} selected {% endif %}>Artificial Intelligence & Machine Learning(AI & ML)</option>
                    <option value="IT" {% if user.branch == 'IT' %} selected {% endif %}>Information Technology (IT)</option>
                    <option value="AeroSpace" {% if user.branch == 'AeroSpace' %} selected {% endif %}>AeroSpace</option>
                </select>
            </div>
             
            <div id="pra" class="ele">
                <h3>Upload Your Resume</h3>
                {% if user.resume %}
                <a href="{{ url_for('static', filename='uploads/' + user.resume)}}" target="_blank">View Resume</a>
                {% endif %}
                <input type="file" name="resume" accept="application/pdf" disabled>
            </div>
           

            <div class="ele">
                <h3>Skills</h3>
                <input type="text" name="skills" value="{{ user.skills }}" readonly placeholder="e.g. Python, Java">
            </div>


        </form>
        <div class="btn">
            <button type="button" id="editBtn" form="pform" onclick="toggleEdit(true)">Edit Profile</button>
            <button type="button" id="cancelBtn" form="pform" onclick="toggleEdit(false)">Cancel Edit</button>
            <button type="submit" id="saveBtn" form="pform" onclick="">Save Changes</button>
        </div>
    </main>
</body>
<script src="{{ url_for('static',filename='js/edit.js') }}"></script>
</html>
